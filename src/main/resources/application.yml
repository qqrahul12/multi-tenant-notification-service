spring:
  application:
    name: notification-service

  # Virtual Threads — Java 21 (Spring Boot 3.2+)
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: notification_user
    password: notification_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  cache:
    type: redis
    redis:
      time-to-live: 300000   # 5 minutes default TTL

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# JWT Configuration
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970  # 256-bit hex key
  expiration-ms: 86400000       # 24 hours
  refresh-expiration-ms: 604800000  # 7 days

# Application Configuration
notification:
  scheduler:
    enabled: true
    poll-interval-ms: 30000     # 30 seconds
    batch-size: 100
  dispatch:
    max-retry-attempts: 3
    retry-backoff-base-seconds: 30   # 30s, 60s, 120s
    virtual-thread-pool-size: 200    # max concurrent dispatches
  channel:
    email:
      failure-rate: 0.1         # 10% failure for demo/testing
    sms:
      failure-rate: 0.05        # 5% failure
    push:
      failure-rate: 0.05
    in-app:
      failure-rate: 0.01
  rate-limit:
    default-per-minute: 100     # fallback if no tenant config
    cache-ttl-minutes: 5        # how long to cache tenant rate limit config

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.notificationservice: DEBUG
    org.springframework.security: INFO
